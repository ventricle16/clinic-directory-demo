<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acupuncture Clinic Directory - Premium Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Roboto',sans-serif;margin:0;background:#eef2f7;color:#333}
header{background:linear-gradient(90deg,#4e54c8,#8f94fb);color:white;padding:40px 20px;text-align:center;box-shadow:0 4px 8px rgba(0,0,0,0.1)}
header h1{margin:0;font-size:2.5em;letter-spacing:1px}
header p{font-size:1.1em;margin-top:8px;opacity:0.9}
.container{max-width:1200px;margin:auto;padding:30px}
.search{display:flex;gap:15px;margin-bottom:30px}
.search input,.search select{flex:1;padding:14px;border-radius:10px;border:1px solid #ccc;box-shadow:0 2px 6px rgba(0,0,0,0.05);transition:0.3s}
.search input:focus,.search select:focus{border-color:#4e54c8;box-shadow:0 4px 12px rgba(78,84,200,0.2);outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:25px}
.card{background:white;border-radius:15px;padding:25px;box-shadow:0 8px 20px rgba(0,0,0,0.08);transition:transform 0.3s,box-shadow 0.3s;cursor:pointer}
.card:hover{transform:translateY(-8px);box-shadow:0 12px 24px rgba(0,0,0,0.15)}
.card h3{margin-top:0;color:#4e54c8}
button{background:#4e54c8;color:white;border:none;padding:12px 16px;border-radius:8px;cursor:pointer;transition:0.3s;box-shadow:0 4px 12px rgba(78,84,200,0.3)}
button:hover{background:#3b3fc1;transform:scale(1.05)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:1000}
.modal-content{background:white;padding:30px;border-radius:15px;width:350px;box-shadow:0 12px 30px rgba(0,0,0,0.2)}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;box-shadow:inset 0 2px 6px rgba(0,0,0,0.05);transition:0.3s}
input:focus{border-color:#4e54c8;box-shadow:0 4px 12px rgba(78,84,200,0.2);outline:none}
.profile{display:none;background:white;padding:25px;border-radius:15px;box-shadow:0 8px 24px rgba(0,0,0,0.08);margin-bottom:30px;transition:0.3s}
.map{margin-top:20px;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.1)}
.admin{margin-top:50px;background:white;padding:25px;border-radius:15px;box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.admin h3{margin-top:0;color:#4e54c8}
.admin input{margin-bottom:12px}
</style>
</head>
<body>

<header>
<h1> Clinic Finder</h1>
<p>Premium Demo: Search, Profiles, Map & Admin Dashboard</p>
</header>

<div class="container">

<div class="profile" id="clinicProfile"></div>

<div class="search">
<input type="text" id="searchInput" placeholder="Search clinics...">
<select id="locationFilter">
<option value="">All Locations</option>
<option>New York</option>
<option>California</option>
<option>Seattle</option>
<option>Texas</option>
<option>Chicago</option>
<option>Boston</option>
</select>
</div>

<div class="grid" id="clinicGrid"></div>

<div class="admin">
<h3>Admin Demo – Add Clinic</h3>
<input id="adminName" placeholder="Clinic Name">
<input id="adminLocation" placeholder="Location">
<input id="adminDesc" placeholder="Specialty / Description">
<button onclick="addClinic()">Add Clinic</button>
<p style="font-size:13px;color:#555;">*Simulate adding clinics to directory dynamically</p>
</div>

</div>

<div class="modal" id="formModal">
<div class="modal-content">
<h3>Quick Appointment Request</h3>
<form id="appointmentForm">
<input type="text" placeholder="Full Name" required>
<input type="email" placeholder="Email" required>
<input type="tel" placeholder="Phone" required>
<button type="submit">Continue to Clinic Booking</button>
</form>
</div>
</div>

<script>
let redirectUrl="";
const clinics=[
{name:"Harmony Acupuncture",location:"New York",desc:"Pain relief & stress therapy",url:"https://exampleclinic.com/book"},
{name:"Zen Balance Clinic",location:"California",desc:"Traditional Chinese medicine",url:"https://exampleclinic.com/book2"},
{name:"Golden Needle Acupuncture",location:"Seattle",desc:"Sports injury therapy",url:"https://exampleclinic.com/book3"},
{name:"Lotus Healing Center",location:"Texas",desc:"Holistic acupuncture care",url:"https://exampleclinic.com/book4"},
{name:"Vital Qi Clinic",location:"Chicago",desc:"Energy balance treatments",url:"https://exampleclinic.com/book5"},
{name:"East West Acupuncture",location:"Boston",desc:"Integrative acupuncture therapy",url:"https://exampleclinic.com/book6"}
];

function renderClinics(list){
const grid=document.getElementById('clinicGrid');
grid.innerHTML="";
list.forEach((c,i)=>{
const card=document.createElement('div');
card.className='card';
card.innerHTML=`<h3>${c.name}</h3><p><b>Location:</b> ${c.location}</p><p>${c.desc}</p><button onclick="viewProfile(${i})">View Profile</button> <button onclick="openForm('${c.url}')">Request Appointment</button>`;
grid.appendChild(card);
});
}

function viewProfile(i){
const c=clinics[i];
const profile=document.getElementById('clinicProfile');
profile.style.display='block';
profile.innerHTML=`<h2>${c.name}</h2><p><b>Location:</b> ${c.location}</p><p>${c.desc}</p><button onclick="openForm('${c.url}')">Request Appointment</button><div class='map'><iframe width='100%' height='250' frameborder='0' style='border:0' src='https://maps.google.com/maps?q=${c.location}&output=embed'></iframe></div>`;
window.scrollTo({top:0,behavior:'smooth'});
}

function openForm(url){redirectUrl=url;document.getElementById('formModal').style.display='flex';}
document.getElementById('appointmentForm').addEventListener('submit',function(e){e.preventDefault();window.location.href=redirectUrl;});
function addClinic(){
const name=document.getElementById('adminName').value;
const location=document.getElementById('adminLocation').value;
const desc=document.getElementById('adminDesc').value;
if(!name||!location)return;
clinics.push({name,location,desc,url:'#'});
renderClinics(clinics);
}

const searchInput=document.getElementById('searchInput');
const locationFilter=document.getElementById('locationFilter');
function filter(){
const text=searchInput.value.toLowerCase();
const loc=locationFilter.value;
const filtered=clinics.filter(c=>c.name.toLowerCase().includes(text)&&(!loc||c.location===loc));
renderClinics(filtered);
}
searchInput.addEventListener('keyup',filter);
locationFilter.addEventListener('change',filter);
renderClinics(clinics);
</script>

</body>
</html>
